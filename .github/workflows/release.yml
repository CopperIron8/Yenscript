name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: windows-2022
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Install Linux native build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - run: dotnet tool restore
      - run: dotnet build Yenscript.sln -c Release -warnaserror
      - run: dotnet test Yenscript.sln -c Release --no-build
      - run: dotnet fantomas src/Yenscript.Core --check
      - run: dotnet fantomas tests/Yenscript.Core.Tests --check
      - run: dotnet format src/Yenscript.Cli/Yenscript.Cli.csproj --verify-no-changes --no-restore
      - run: dotnet format tests/Yenscript.Cli.Tests/Yenscript.Cli.Tests.csproj --verify-no-changes --no-restore
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -I scripts/install-wabt.py
      - run: python -I scripts/install-wasm-tools.py
      - run: python -I -m pip install wasmtime==38.0.0
      - name: Execute WebAssembly integration fixtures
        shell: bash
        run: bash scripts/wasm-integration.sh
      - name: Publish and smoke-test native binary
        shell: bash
        run: bash scripts/publish.sh '${{ matrix.rid }}'
      - name: Archive standalone executable
        shell: bash
        run: |
          mkdir -p artifacts/release
          if [[ '${{ matrix.rid }}' == win-x64 ]]; then
            cp LICENSE artifacts/publish/win-x64/LICENSE
            (cd artifacts/publish/win-x64 && 7z a ../../release/yenscript-win-x64.zip yenscriptc.exe LICENSE)
          else
            cp LICENSE 'artifacts/publish/${{ matrix.rid }}/LICENSE'
            tar -czf 'artifacts/release/yenscript-${{ matrix.rid }}.tar.gz' -C 'artifacts/publish/${{ matrix.rid }}' yenscriptc LICENSE
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/release/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Generate archive checksums
        run: cd release && sha256sum *.zip *.tar.gz > SHA256SUMS.txt
      - name: Publish release with platform archives
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: gh release create "$TAG" release/* --repo "$REPOSITORY" --verify-tag --generate-notes --title "Yenscript $TAG"
